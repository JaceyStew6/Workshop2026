<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portail de paiement (fictif)</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Portail de paiement</h1>
  <p class="banner">Environnement de démonstration : toutes les données sont fictives.</p>

  <section class="card" id="login"></section>

  <section class="card" id="pay" hidden>
    <h2>Nouveau virement</h2>
    <label for="src">Compte source</label><input id="src" value="ACC-DEMO-1">
    <label for="dst">Compte destinataire</label><input id="dst" value="ACC-DEMO-2">
    <label for="amt">Montant (EUR)</label><input id="amt" type="number" min="0.01" max="10000" step="0.01" value="25.00">
    <div class="row"><button id="bq" type="button">Estimer les frais</button> <button id="bp" type="button">Valider le virement</button></div>
  </section>

  <section class="card"><h2>Résultat</h2><div id="out">En attente.</div></section>
  <p class="muted"><a href="/backoffice.html">Back-office (administration)</a></p>
</main>
<script src="/common.js"></script>
<script src="/login.js"></script>
<script src="/app.js"></script>
</body>
</html>
