server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  # Lecture seule : on ne relaie QUE les routes GET du moteur (pas le POST /v1/incidents réservé au détecteur)
  location /v1/ {
    limit_except GET { deny all; }
    proxy_pass http://remediation-engine:8000;
    proxy_read_timeout 5s;
  }
  location / { try_files $uri /index.html; }
}
