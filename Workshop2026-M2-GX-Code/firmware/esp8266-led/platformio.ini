; Voyant bicolore piloté par l'ESP8266 (NodeMCU v2 / ESP-12E). Projet PlatformIO, à ouvrir dans CLion :
;   CLion > Settings > Plugins : « PlatformIO for CLion » ; File > Open > ce dossier (firmware/esp8266-led).
; Ligne de commande équivalente :  pio run  /  pio run -t upload  /  pio device monitor
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -Wall
    -Wextra
    -DPIN_LED_GREEN=5
    -DPIN_LED_RED=4
; GPIO5 = D1 : anode verte  (résistance 220 ohms en série)
; GPIO4 = D2 : anode rouge  (résistance 220 ohms en série)
