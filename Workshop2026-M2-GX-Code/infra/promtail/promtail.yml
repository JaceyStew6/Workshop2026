server: { http_listen_port: 9080 }
positions: { filename: /tmp/positions.yaml }
clients: [{ url: "http://loki:3100/loki/api/v1/push" }]
scrape_configs:
  - job_name: containers
    # lecture des journaux via docker-ro (proxy lecture seule), jamais via le socket brut
    docker_sd_configs:
      - host: tcp://docker-ro:2375
        refresh_interval: 5s
        filters: [{ name: label, values: ["com.docker.compose.project=resilience-alpha"] }]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - json:
          expressions: { event: event, action: action, kind: kind }
      - labels: { event: , action: , kind: }   # faible cardinalité uniquement ; client_ip reste dans la ligne (| json)
